# Multiplayer game server (free plan). Deploy with: npm run deploy:server
# The static game itself is still served by Cloudflare Pages (wrangler.toml).
name = "war-of-spacex-ws"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# SQLite-backed Durable Objects are the ones available on the free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
